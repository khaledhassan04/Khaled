        <rect x="436" y="124" width="58" height="18" rx="9" fill="#854d0e"/>
        <text x="444" y="137" fill="#fef08a" font-family="system-ui" font-size="9" font-weight="700">Pending</text>

        <!-- Table Row 4 -->
        <line x1="0" y1="152" x2="510" y2="152" stroke="#1e293b"/>
        <text x="16" y="176" fill="#e2e8f0" font-family="monospace" font-size="10">#INV-8918</text>
        <text x="120" y="176" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="600">Chittagong Port Logistics</text>
