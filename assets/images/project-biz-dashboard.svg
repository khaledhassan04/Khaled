        <text x="350" y="176" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700">৳ 520,000</text>
        <rect x="436" y="164" width="58" height="18" rx="9" fill="#065f46"/>
        <text x="446" y="177" fill="#a7f3d0" font-family="system-ui" font-size="9" font-weight="700">Paid &check;</text>
