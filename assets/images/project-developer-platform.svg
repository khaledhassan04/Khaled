<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#devBg)"/>

  <!-- Developer Platform Window -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#0b0f19" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Terminal Top Bar -->
    <rect width="680" height="44" rx="16" fill="#030712"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5" fill="#10b981"/>
    <text x="90" y="26" fill="#9ca3af" font-family="monospace" font-size="11">bash &mdash; dev-edge-proxy.ts &mdash; 99.999% SLA</text>
    <rect x="540" y="12" width="110" height="20" rx="10" fill="#064e3b"/>
    <circle cx="552" cy="22" r="3.5" fill="#34d399"/>
    <text x="564" y="26" fill="#a7f3d0" font-family="system-ui" font-size="10" font-weight="600">Edge Live: 12ms</text>

    <!-- Code Editor Section -->
    <g transform="translate(30, 65)">
      <!-- Line Numbers and Code -->
      <text x="0" y="25" fill="#475569" font-family="monospace" font-size="12">01</text>
      <text x="35" y="25" fill="#818cf8" font-family="monospace" font-size="12">import</text>
      <text x="85" y="25" fill="#e2e8f0" font-family="monospace" font-size="12">{ EdgeRouter, RateLimiter }</text>
      <text x="310" y="25" fill="#818cf8" font-family="monospace" font-size="12">from</text>
      <text x="345" y="25" fill="#34d399" font-family="monospace" font-size="12">'@flux/core'</text>

      <text x="0" y="55" fill="#475569" font-family="monospace" font-size="12">02</text>
      <text x="35" y="55" fill="#f43f5e" font-family="monospace" font-size="12">export default</text>
      <text x="145" y="55" fill="#38bdf8" font-family="monospace" font-size="12">async function</text>
      <text x="255" y="55" fill="#fbbf24" font-family="monospace" font-size="12">handler</text>
      <text x="310" y="55" fill="#e2e8f0" font-family="monospace" font-size="12">(req: Request) {</text>

      <text x="0" y="85" fill="#475569" font-family="monospace" font-size="12">03</text>
      <text x="55" y="85" fill="#818cf8" font-family="monospace" font-size="12">const</text>
      <text x="100" y="85" fill="#e2e8f0" font-family="monospace" font-size="12">router = </text>
      <text x="175" y="85" fill="#818cf8" font-family="monospace" font-size="12">new</text>
      <text x="205" y="85" fill="#38bdf8" font-family="monospace" font-size="12">EdgeRouter</text>
      <text x="290" y="85" fill="#e2e8f0" font-family="monospace" font-size="12">({ region: </text>
      <text x="375" y="85" fill="#34d399" font-family="monospace" font-size="12">'global-nearest'</text>
      <text x="500" y="85" fill="#e2e8f0" font-family="monospace" font-size="12"> });</text>

      <text x="0" y="115" fill="#475569" font-family="monospace" font-size="12">04</text>
      <text x="55" y="115" fill="#818cf8" font-family="monospace" font-size="12">return await</text>
      <text x="155" y="115" fill="#e2e8f0" font-family="monospace" font-size="12">router.</text>
      <text x="210" y="115" fill="#fbbf24" font-family="monospace" font-size="12">dispatchStream</text>
      <text x="325" y="115" fill="#e2e8f0" font-family="monospace" font-size="12">(req, { cacheTTL: </text>
      <text x="460" y="115" fill="#f97316" font-family="monospace" font-size="12">300</text>
      <text x="488" y="115" fill="#e2e8f0" font-family="monospace" font-size="12"> });</text>

      <text x="0" y="145" fill="#475569" font-family="monospace" font-size="12">05</text>
      <text x="35" y="145" fill="#e2e8f0" font-family="monospace" font-size="12">}</text>
    </g>

    <!-- Terminal Bottom Output Box -->
    <g transform="translate(30, 240)">
      <rect width="620" height="135" rx="10" fill="#030712" stroke="#1f2937" stroke-width="1"/>
      <text x="20" y="30" fill="#10b981" font-family="monospace" font-size="12">&check; Benchmarks: 4,200 req/sec sustained</text>
      <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">&rarr; Memory footprint: 14.2 MB RSS</text>
      <text x="20" y="80" fill="#38bdf8" font-family="monospace" font-size="12">&rarr; P99 Latency: 11.4ms across 35 edge regions</text>
      
      <!-- Progress visual bar -->
      <rect x="20" y="102" width="580" height="12" rx="6" fill="#1e293b"/>
      <rect x="20" y="102" width="540" height="12" rx="6" fill="url(#greenPulse)"/>
    </g>
  </g>
</svg>
