<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="khsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="khsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="khsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <rect width="400" height="400" rx="200" fill="url(#khsBg)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#khsAccent)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="140" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Stylized Geometric Monogram / Emblem: KHS -->
  <g transform="translate(110, 110)">
    <!-- Monogram K -->
    <path d="M 20 20 L 20 160" stroke="url(#khsAccent)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 85 30 L 25 90 L 90 155" stroke="url(#khsAccent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle Connected Nodes / Digital Craft -->
    <circle cx="20" cy="20" r="8" fill="#38bdf8"/>
    <circle cx="20" cy="160" r="8" fill="#6366f1"/>
    <circle cx="85" cy="30" r="8" fill="#a855f7"/>
    <circle cx="90" cy="155" r="8" fill="#38bdf8"/>

    <!-- Mini Code & Design Emblems -->
    <g transform="translate(110, 35)">
      <!-- Pen Tool / Bezier Node -->
      <polygon points="25,5 35,25 25,45 15,25" fill="#ec4899" opacity="0.8"/>
      <line x1="25" y1="45" x2="25" y2="70" stroke="#ec4899" stroke-width="2"/>

      <!-- Code Brackets -->
      <text x="10" y="105" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="700">&lt;/&gt;</text>
    </g>
  </g>

  <!-- Bottom Badge: UI/UX & Developer -->
  <g transform="translate(90, 310)">
    <rect width="220" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="4.5" fill="#10b981"/>
    <text x="36" y="22" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="700">KHALED HASSAN SALAM</text>
  </g>
</svg>
