<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#140f2b"/>
    </linearGradient>
    <linearGradient id="aiBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)"/>
  <circle cx="400" cy="220" r="190" fill="#38bdf8" opacity="0.12" filter="url(#aiGlow)"/>

  <!-- Main Workspace Window -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Window top bar -->
    <rect width="680" height="44" rx="16" fill="#0b1120"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5" fill="#10b981"/>
    <rect x="240" y="12" width="200" height="20" rx="10" fill="#1e293b"/>
    <text x="270" y="26" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">Cognitive Canvas &bull; v2.4</text>

    <!-- Node Graph visualization in center -->
    <g transform="translate(40, 70)">
      <!-- Connector Lines -->
      <path d="M 90 90 C 180 90, 180 40, 270 40" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
      <path d="M 90 90 C 180 90, 180 150, 270 150" stroke="#a855f7" stroke-width="2" fill="none"/>
      <path d="M 390 40 C 460 40, 460 90, 520 90" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <path d="M 390 150 C 460 150, 460 90, 520 90" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

      <!-- Node 1: Input Prompt -->
      <rect x="0" y="65" width="120" height="55" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="14" y="88" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="600">User Prompt</text>
      <text x="14" y="106" fill="#38bdf8" font-family="monospace" font-size="9">Natural Lang</text>

      <!-- Node 2: Embeddings Model -->
      <rect x="240" y="15" width="140" height="55" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="254" y="38" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="600">Semantic Graph</text>
      <text x="254" y="56" fill="#a78bfa" font-family="monospace" font-size="9">Vector Search &bull; 99%</text>

      <!-- Node 3: Reasoning Agent -->
      <rect x="240" y="125" width="140" height="55" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="254" y="148" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="600">Deep Planner</text>
      <text x="254" y="166" fill="#f472b6" font-family="monospace" font-size="9">Multi-Agent State</text>

      <!-- Node 4: Synthesis Output -->
      <rect x="490" y="65" width="130" height="55" rx="10" fill="url(#aiBeam)"/>
      <text x="506" y="88" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Synthesized UI</text>
      <text x="506" y="106" fill="#f1f5f9" font-family="monospace" font-size="9">Live React Stream</text>
    </g>

    <!-- Interactive Prompt Bar at Bottom -->
    <g transform="translate(40, 290)">
      <rect width="600" height="55" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui" font-size="13">"Generate accessible dashboard UI with real-time streaming charts..."</text>
      <rect x="520" y="10" width="68" height="35" rx="8" fill="url(#aiBeam)"/>
      <text x="536" y="32" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Run &rarr;</text>
    </g>
  </g>
</svg>
