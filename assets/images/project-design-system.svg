<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#dsBg)"/>
  <circle cx="200" cy="140" r="140" fill="#ec4899" opacity="0.15" filter="url(#dsGlow)"/>
  <circle cx="680" cy="380" r="160" fill="#8b5cf6" opacity="0.16" filter="url(#dsGlow)"/>

  <!-- Design System Canvas Card -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="680" height="48" rx="16" fill="#1f2937" opacity="0.6"/>
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>
    <text x="90" y="29" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Aura Design System v3.2</text>
    <rect x="520" y="14" width="130" height="20" rx="10" fill="#374151"/>
    <text x="540" y="28" fill="#9ca3af" font-family="system-ui" font-size="10">Tokens &amp; Components</text>

    <!-- Column 1: Color Tokens -->
    <g transform="translate(30, 70)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">COLOR TOKENS</text>
      
      <circle cx="16" cy="30" r="16" fill="#6366f1"/>
      <text x="44" y="26" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Indigo Core</text>
      <text x="44" y="40" fill="#64748b" font-family="monospace" font-size="10">#6366F1</text>

      <circle cx="16" cy="80" r="16" fill="#ec4899"/>
      <text x="44" y="76" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Rose Pulse</text>
      <text x="44" y="90" fill="#64748b" font-family="monospace" font-size="10">#EC4899</text>

      <circle cx="16" cy="130" r="16" fill="#10b981"/>
      <text x="44" y="126" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Emerald Success</text>
      <text x="44" y="140" fill="#64748b" font-family="monospace" font-size="10">#10B981</text>

      <circle cx="16" cy="180" r="16" fill="#06b6d4"/>
      <text x="44" y="176" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Cyan Horizon</text>
      <text x="44" y="190" fill="#64748b" font-family="monospace" font-size="10">#06B6D4</text>
    </g>

    <!-- Column 2: Typography Scale -->
    <g transform="translate(200, 70)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">TYPE SCALES</text>
      <text x="0" y="32" fill="#ffffff" font-family="system-ui" font-size="24" font-weight="800">Display Bold 32</text>
      <text x="0" y="66" fill="#e2e8f0" font-family="system-ui" font-size="18" font-weight="600">Headline Medium 24</text>
      <text x="0" y="98" fill="#cbd5e1" font-family="system-ui" font-size="14" font-weight="500">Body Regular &bull; 16px Inter/Jakarta</text>
      <text x="0" y="124" fill="#64748b" font-family="system-ui" font-size="12">Caption / Microcopy &bull; 12px High Contrast</text>
    </g>

    <!-- Column 3: Component Showcase (Buttons, Switches, Badges) -->
    <g transform="translate(420, 70)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">INTERACTIVE STATES</text>
      
      <!-- Primary Pill Button -->
      <rect x="0" y="18" width="130" height="38" rx="19" fill="url(#pinkGrad)"/>
      <text x="32" y="42" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Primary UI</text>

      <!-- Outline Button -->
      <rect x="145" y="18" width="85" height="38" rx="8" fill="transparent" stroke="#475569" stroke-width="1.5"/>
      <text x="166" y="42" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Ghost</text>

      <!-- Toggle Switch active -->
      <g transform="translate(0, 75)">
        <rect width="52" height="28" rx="14" fill="#6366f1"/>
        <circle cx="38" cy="14" r="10" fill="#ffffff"/>
        <text x="64" y="19" fill="#cbd5e1" font-family="system-ui" font-size="12">Dark Theme: On</text>
      </g>

      <!-- Toggle Switch inactive -->
      <g transform="translate(0, 115)">
        <rect width="52" height="28" rx="14" fill="#334155"/>
        <circle cx="14" cy="14" r="10" fill="#94a3b8"/>
        <text x="64" y="19" fill="#94a3b8" font-family="system-ui" font-size="12">Haptic Audio: Off</text>
      </g>

      <!-- Badges -->
      <g transform="translate(0, 160)">
        <rect width="70" height="22" rx="6" fill="#10b981" fill-opacity="0.2"/>
        <text x="12" y="15" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700">WCAG AAA</text>

        <rect x="80" width="80" height="22" rx="6" fill="#6366f1" fill-opacity="0.2"/>
        <text x="92" y="15" fill="#818cf8" font-family="system-ui" font-size="10" font-weight="700">48 Components</text>
      </g>
    </g>

    <!-- Bottom Code Snippet Preview -->
    <g transform="translate(30, 290)">
      <rect width="620" height="90" rx="10" fill="#0a0e17" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#64748b"/>
      <circle cx="34" cy="20" r="4" fill="#64748b"/>
      <circle cx="48" cy="20" r="4" fill="#64748b"/>
      <text x="70" y="24" fill="#64748b" font-family="monospace" font-size="10">aura-tokens.config.ts</text>
      <text x="24" y="52" fill="#f43f5e" font-family="monospace" font-size="12">export const</text>
      <text x="120" y="52" fill="#38bdf8" font-family="monospace" font-size="12">designTokens</text>
      <text x="235" y="52" fill="#cbd5e1" font-family="monospace" font-size="12">= { radius: </text>
      <text x="320" y="52" fill="#fbbf24" font-family="monospace" font-size="12">'12px'</text>
      <text x="365" y="52" fill="#cbd5e1" font-family="monospace" font-size="12">, mode: </text>
      <text x="425" y="52" fill="#a7f3d0" font-family="monospace" font-size="12">'dynamic'</text>
      <text x="495" y="52" fill="#cbd5e1" font-family="monospace" font-size="12">, contrast: </text>
      <text x="580" y="52" fill="#fbbf24" font-family="monospace" font-size="12">'high'</text>
      <text x="618" y="52" fill="#cbd5e1" font-family="monospace" font-size="12">};</text>
      <text x="24" y="74" fill="#64748b" font-family="monospace" font-size="11">// Synchronized Figma REST API &amp; React Tailwind Plugins</text>
    </g>
  </g>
</svg>
