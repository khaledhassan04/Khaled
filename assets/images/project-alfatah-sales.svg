<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="afBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061325"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#14365d"/>
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="afGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient canvas background -->
  <rect width="800" height="500" fill="url(#afBg)"/>
  <circle cx="240" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="url(#afGlow)"/>
  <circle cx="560" cy="340" r="170" fill="#10b981" opacity="0.12" filter="url(#afGlow)"/>

  <!-- Left: Mobile Phone Device (Al Fatah Field Sales App) -->
  <g transform="translate(100, 35)">
    <!-- Device body -->
    <rect width="250" height="430" rx="34" fill="#0b1626" stroke="#2a4365" stroke-width="2.5"/>
    <!-- Speaker & Dynamic island -->
    <rect x="85" y="10" width="80" height="18" rx="9" fill="#020813"/>
    <circle cx="150" cy="19" r="3" fill="#1e293b"/>

    <!-- App Top Bar -->
    <g transform="translate(18, 40)">
      <text x="0" y="12" fill="#94a3b8" font-family="system-ui" font-size="9" font-weight="600">AL FATAH ERP &bull; FIELD OPS</text>
      <text x="0" y="32" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">Daily Sales Route</text>
      <rect x="160" y="14" width="54" height="18" rx="9" fill="url(#emeraldGrad)"/>
      <text x="168" y="27" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="700">&bull; GPS LIVE</text>
    </g>

    <!-- Visit Plan Quick Metric -->
    <g transform="translate(18, 88)">
      <rect width="214" height="52" rx="10" fill="#142642" stroke="#25426e" stroke-width="1"/>
      <text x="12" y="20" fill="#7dd3fc" font-family="system-ui" font-size="9" font-weight="700">TODAY'S TARGET</text>
      <text x="12" y="39" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="800">8 / 12 Visits</text>
      <rect x="130" y="16" width="72" height="22" rx="6" fill="#0284c7" opacity="0.2"/>
      <text x="138" y="31" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="700">67% Done</text>
    </g>

    <!-- GPS Map Mini Route View -->
    <g transform="translate(18, 150)">
      <rect width="214" height="110" rx="12" fill="#0a1526" stroke="#1e3a5f" stroke-width="1"/>
      <!-- Map grid roads -->
      <path d="M 10 30 Q 80 50 140 20 T 204 70" stroke="#1e3a5f" stroke-width="4" fill="none"/>
      <path d="M 50 10 L 50 100" stroke="#1e3a5f" stroke-width="3" fill="none"/>
      <path d="M 160 10 L 160 100" stroke="#1e3a5f" stroke-width="3" fill="none"/>
      <!-- Waypoints -->
      <circle cx="50" cy="40" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="110" cy="30" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
      <circle cx="160" cy="55" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="68" y="75" width="136" height="26" rx="6" fill="#0f1f38" stroke="#38bdf8" stroke-width="1"/>
      <text x="76" y="92" fill="#f8fafc" font-family="system-ui" font-size="8" font-weight="600">Next: City College Library</text>
    </g>

    <!-- Order & Demand Capture Action Cards -->
    <g transform="translate(18, 272)">
      <!-- Card 1: Book Promotion & Demand -->
      <rect width="102" height="60" rx="10" fill="#12233c" stroke="#25426e" stroke-width="1"/>
      <text x="10" y="20" fill="#94a3b8" font-family="system-ui" font-size="8" font-weight="600">DEMAND CAPTURE</text>
      <text x="10" y="42" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">350 Books</text>
      <text x="10" y="54" fill="#34d399" font-family="system-ui" font-size="7">+24 Institution Orders</text>

      <!-- Card 2: Attendance & Expenses -->
      <rect x="112" width="102" height="60" rx="10" fill="#12233c" stroke="#25426e" stroke-width="1"/>
      <text x="122" y="20" fill="#94a3b8" font-family="system-ui" font-size="8" font-weight="600">EXPENSE SYNC</text>
      <text x="122" y="42" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">৳ 1,420</text>
      <text x="122" y="54" fill="#60a5fa" font-family="system-ui" font-size="7">&check; Auto-verified</text>
    </g>

    <!-- Bottom Mobile Nav -->
    <g transform="translate(18, 346)">
      <rect width="214" height="42" rx="14" fill="#08101c" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="36" cy="21" r="5" fill="#38bdf8"/>
      <circle cx="80" cy="21" r="4" fill="#475569"/>
      <circle cx="134" cy="21" r="4" fill="#475569"/>
      <circle cx="178" cy="21" r="4" fill="#475569"/>
    </g>
  </g>

  <!-- Right: Feature Cards & UX Highlights -->
  <g transform="translate(400, 70)">
    <rect width="340" height="90" rx="14" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="16" fill="#38bdf8" opacity="0.2"/>
    <text x="28" y="42" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="bold">&bull;</text>
    <text x="64" y="34" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">GPS Field Tracking &amp; Visit Routes</text>
    <text x="64" y="52" fill="#94a3b8" font-family="system-ui" font-size="11">Real-time attendance, distance covered, and automated route planning for reps.</text>

    <rect y="105" width="340" height="90" rx="14" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="34" cy="141" r="16" fill="#10b981" opacity="0.2"/>
    <text x="28" y="147" fill="#10b981" font-family="system-ui" font-size="14" font-weight="bold">&bull;</text>
    <text x="64" y="139" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Institution &amp; Book Demand Orders</text>
    <text x="64" y="157" fill="#94a3b8" font-family="system-ui" font-size="11">Instant offline sales order creation, sample tracking, and invoice dispatch.</text>

    <rect y="210" width="340" height="90" rx="14" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="34" cy="246" r="16" fill="#f59e0b" opacity="0.2"/>
    <text x="28" y="252" fill="#f59e0b" font-family="system-ui" font-size="14" font-weight="bold">&bull;</text>
    <text x="64" y="244" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Role-Based Operations Dashboard</text>
    <text x="64" y="262" fill="#94a3b8" font-family="system-ui" font-size="11">Seamless manager oversight across regional sales territories and expense claims.</text>
  </g>
</svg>
